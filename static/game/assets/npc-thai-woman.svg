<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Thai Woman NPC - 8-bit style -->
  <!-- Hair -->
  <rect x="6" y="4" width="20" height="6" fill="#2C1810"/>
  <rect x="4" y="6" width="24" height="4" fill="#2C1810"/>
  
  <!-- Face -->
  <rect x="8" y="8" width="16" height="8" fill="#FFDBAC"/>
  
  <!-- Eyes -->
  <rect x="10" y="10" width="2" height="2" fill="#000"/>
  <rect x="20" y="10" width="2" height="2" fill="#000"/>
  
  <!-- Nose -->
  <rect x="15" y="12" width="2" height="1" fill="#FFB366"/>
  
  <!-- Mouth -->
  <rect x="14" y="14" width="4" height="1" fill="#FF6B6B"/>
  
  <!-- Traditional Thai Dress -->
  <rect x="4" y="16" width="24" height="12" fill="#E91E63"/>
  <rect x="6" y="18" width="20" height="2" fill="#AD1457"/>
  <rect x="8" y="20" width="16" height="2" fill="#C2185B"/>
  
  <!-- Arms -->
  <rect x="0" y="16" width="4" height="8" fill="#FFDBAC"/>
  <rect x="28" y="16" width="4" height="8" fill="#FFDBAC"/>
  
  <!-- Legs -->
  <rect x="10" y="28" width="4" height="4" fill="#8D6E63"/>
  <rect x="18" y="28" width="4" height="4" fill="#8D6E63"/>
  
  <!-- Traditional accessories -->
  <rect x="12" y="6" width="8" height="2" fill="#FFD700"/>
