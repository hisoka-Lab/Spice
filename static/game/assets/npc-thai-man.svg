  <!-- Traditional Thai Shirt -->
  <rect x="6" y="16" width="20" height="8" fill="#FF9800"/>
  <rect x="8" y="18" width="16" height="2" fill="#F57C00"/>
  
  <!-- Traditional Pattern -->
  <rect x="10" y="16" width="2" height="2" fill="#FFD700"/>
