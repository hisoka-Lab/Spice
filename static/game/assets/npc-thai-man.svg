  <rect x="18" y="16" width="2" height="2" fill="#FFD700"/>
  <rect x="12" y="20" width="2" height="2" fill="#FFD700"/>
  <rect x="16" y="20" width="2" height="2" fill="#FFD700"/>
  
  <!-- Arms -->
  <rect x="2" y="16" width="4" height="8" fill="#FFDBAC"/>
  <rect x="26" y="16" width="4" height="8" fill="#FFDBAC"/>
  
  <!-- Pants -->
  <rect x="8" y="24" width="16" height="6" fill="#424242"/>
  
  <!-- Legs -->
  <rect x="10" y="30" width="4" height="2" fill="#8D6E63"/>
